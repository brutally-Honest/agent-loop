# agent-loop configuration — sourced by bash, so keep it KEY="value".
# Agents can't edit this file (guard.sh + a permission deny rule); you can.

# The one command that says "the repo is healthy": tests + lint + build.
# Runs before the first task, after every DONE, and must not modify files.
VERIFY_CMD="make verify"

# Optional: lets agents run a subset — loop.sh test ./internal/foo -run TestX
TEST_CMD=""                  # e.g. "go test" | "npx vitest run" | "pytest -q"

BASE_BRANCH=""               # empty = auto (origin/HEAD, then main, master, trunk, develop)
SPECS_DIR="specs"
MAX_FIX_ROUNDS=2             # reviewer FIX (or failed post-task) rounds per task before the run stops
PLAN_MAX_LINES=200           # "not verbose" made concrete
QUICK_MAX_ACS=5              # /quick refuses bigger briefs: use /spec
QUICK_MAX_STEPS=5

# No agent may change these (hard deny in guard.sh and in post-task).
PROTECTED_GLOBS=".githooks/* .github/workflows/*"

# Agents may change these, but the reviewer is shown every change to them
# (the usual way to "make it pass" is to weaken a check).
WATCHED_GLOBS="Makefile go.mod go.sum package.json package-lock.json pnpm-lock.yaml .golangci.yml .golangci.yaml .eslintrc* eslint.config.* tsconfig*.json"

# What counts as a test file (a task that names tests must touch one of these).
TEST_GLOBS="*_test.go *.test.* *.spec.* test_*.py *_test.py tests/* test/* */tests/* */test/* */__tests__/*"

# Extra read-only commands the reviewer/planner/tasker may run, as |-separated prefixes.
READONLY_EXTRA_CMDS=""       # e.g. "go list|go doc|go vet|npm ls"
